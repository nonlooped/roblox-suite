# Typos configuration for Roblox Suite
# https://github.com/crate-ci/typos

[default.extend-words]
# Accept project-specific terms (Luau, Roblox APIs, graphics terms, etc.) as valid
Luau = "Luau"
luau = "luau"
Datastore = "Datastore"
DataStore = "DataStore"
MicroProfiler = "MicroProfiler"
RunContext = "RunContext"
PreSimulation = "PreSimulation"
PreRender = "PreRender"
IKControl = "IKControl"
Animator = "Animator"
AnimationTrack = "AnimationTrack"
TweenService = "TweenService"
ContentProvider = "ContentProvider"
MarketplaceService = "MarketplaceService"
PathfindingService = "PathfindingService"
MemoryStore = "MemoryStore"
BindToClose = "BindToClose"
PromptGamePassPurchaseFinished = "PromptGamePassPurchaseFinished"
UserOwnsGamePassAsync = "UserOwnsGamePassAsync"
GetProductInfoAsync = "GetProductInfoAsync"
UpdateAsync = "UpdateAsync"
SetAsync = "SetAsync"
GetAsync = "GetAsync"
ListKeysAsync = "ListKeysAsync"
ListVersionsAsync = "ListVersionsAsync"
OrderedDataStore = "OrderedDataStore"
GlobalDataStore = "GlobalDataStore"
Roblox = "Roblox"
roblox = "roblox"
Studio = "Studio"
MCP = "MCP"
npx = "npx"
"skills.sh" = "skills.sh"
LOD = "LOD"
Unparented = "Unparented"
unparented = "unparented"

[default]
# Google Search Console verification token is a random hash; typos flags
# the "FO" substring inside it as a misspelling of OF/FOR/DO/GO/TO.
extend-ignore-re = ["Ri5YRxBLp5tUFERvt908GtJ83VTj97RY3vbpHJQwVxs"]

[files]
# Only check the files we care about
extend-exclude = [
    "node_modules/",
    "dist/",
    "*.rbxl",
    "*.rbxlx",
]
