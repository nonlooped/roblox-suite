name: Monitor official Roblox documentation

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  creator-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find recent relevant Creator Docs changes
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          pattern='data-store|memory-store|monetization|game-pass|robux-transfer|teleport|open-cloud|cloud/reference|network|security|animation|physics|audio|pathfinding|studio/mcp|scripting/sync'
          : > /tmp/changes.txt
          gh api --paginate "repos/Roblox/creator-docs/commits?since=$since&per_page=30" --jq '.[].sha' |
          while read -r sha; do
            files=$(gh api "repos/Roblox/creator-docs/commits/$sha" --jq '.files[].filename' | grep -Ei '\.(md|mdx|ya?ml|json)$' | grep -Ei "$pattern" || true)
            if [ -n "$files" ]; then
              summary=$(gh api "repos/Roblox/creator-docs/commits/$sha" --jq '.commit.message' | head -1)
              url="https://github.com/Roblox/creator-docs/commit/$sha"
              printf -- '- [%s](%s) — %s\n' "${sha:0:8}" "$url" "$summary" >> /tmp/changes.txt
              while read -r file; do printf '  - `%s`\n' "$file" >> /tmp/changes.txt; done <<< "$files"
            fi
          done
          if [ -s /tmp/changes.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a review issue (never rewrite guidance automatically)
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Official Creator Docs changed in areas covered by Roblox Suite. Review affected claims, examples, source dates, and deprecations; do not bump verification dates without checking the content."
            echo
            cat /tmp/changes.txt
            echo
            echo "Generated by the scheduled source monitor."
          } > /tmp/body.md
          gh label create source-drift --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Official source changed, moved, or contradicts guidance" --force
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label source-drift --search 'Official Roblox docs changed in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Official Roblox docs changed — review required" --label source-drift --body-file /tmp/body.md
          fi
