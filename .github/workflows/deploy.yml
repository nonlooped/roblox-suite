name: Deploy site to Vercel

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog.json"
      - "skills.sh.json"
      - "roblox/**"
      - "roblox-*/**"
      - "scripts/**"
      - "schemas/**"
      - "vercel.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Validate and build
        working-directory: site
        run: npm test

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build production deployment
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify live catalog routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://roblox-suite.vercel.app"
          count=$(node -p "require('./catalog.json').skills.length")
          for attempt in 1 2 3 4 5; do
            home=$(curl -fsSL "$base/")
            skills=$(curl -fsSL "$base/skills/")
            if grep -q "$count skills" <<<"$home" && grep -q "$count skills" <<<"$skills"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "deployed counts do not match catalog ($count)" >&2
              exit 1
            fi
            sleep 10
          done
          node -e "for (const skill of require('./catalog.json').skills) console.log(skill.slug)" |
          while read -r slug; do
            curl -fsSL --retry 3 "$base/skills/$slug/" >/dev/null
          done
          curl -fsSL --retry 3 "$base/sitemap.xml" | grep -q '<urlset'
          curl -fsSL --retry 3 "$base/robots.txt" | grep -q 'Sitemap: https://roblox-suite.vercel.app/sitemap.xml'
