name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Allow manual runs from Actions tab

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Markdown links (internal + external)
        uses: lycheeverse/lychee-action@v2
        with:
          # Roblox's Creator Hub (create.roblox.com) intermittently returns
          # 503/429 at check time — these are transient server-side errors,
          # not broken doc links. Retrying + tolerating them avoids false
          # failures on a flaky upstream.
          args: |
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200,429,503
            --exclude "rbxassetid://.*"
            --exclude "mailto:.*"
            "**/*.md"
          fail: true

      - name: Validate skills.sh.json against official schema
        run: |
          npm install -g ajv-cli ajv-formats 2>&1 | tail -1
          curl -sL https://skills.sh/schemas/skills.sh.schema.json -o /tmp/skills.schema.json
          ajv validate \
            -s /tmp/skills.schema.json \
            -d skills.sh.json \
            --strict=false \
            --spec=draft2020 \
            --errors=text

      - name: Spell check (typos)
        uses: crate-ci/typos@master