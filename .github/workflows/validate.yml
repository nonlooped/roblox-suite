name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links (internal + external)
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --verbose
            --no-progress
            --exclude "rbxassetid://.*"
            --exclude "mailto:.*"
            "**/*.md"
          fail: true

      - name: Validate skills.sh.json against official schema
        run: |
          npm install -g ajv-cli ajv-formats 2>&1 | tail -1
          curl -sL https://skills.sh/schemas/skills.sh.schema.json -o /tmp/skills.schema.json
          ajv validate \
            -s /tmp/skills.schema.json \
            -d skills.sh.json \
            --strict=false \
            --spec=draft2020 \
            --errors=text

      - name: Spell check (typos)
        uses: crate-ci/typos@master
        # Add a _typos.toml at repo root later if you need custom dictionary

